[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "taxflow-ai"
version = "9.0.0"
description = "TaxFlow AI Backend"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"              # Exact Python range – no ambiguity
fastapi = "*"                         # Latest version, whatever it is
uvicorn = { extras = ["standard"], version = "*" }
pydantic = "*"
pydantic-settings = "*"
sqlalchemy = "*"
asyncpg = "*"
alembic = "*"
redis = "*"
celery = "*"
httpx = "*"
python-jose = { extras = ["cryptography"], version = "*" }
passlib = { extras = ["argon2"], version = "*" }
python-multipart = "*"
openai = "*"
stripe = "*"
boto3 = "*"
tenacity = "*"
structlog = "*"
prometheus-client = "*"
# 🔥 OpenTelemetry – using the most basic meta-package
opentelemetry-api = "*"
opentelemetry-sdk = "*"
opentelemetry-instrumentation = "*"   # This includes FastAPI instrumentation
slowapi = "*"
pyotp = "*"
qrcode = "*"
email-validator = "*"
cryptography = "*"
pgvector = "*"
aiosmtplib = "*"
jinja2 = "*"
sentry-sdk = "*"
pandas = "*"
openpyxl = "*"
aiocache = { extras = ["redis"], version = "*" }
pillow = "*"
pdfplumber = "*"
httpx-oauth = "*"
mixpanel = "*"
pyarrow = "*"

# 🔥 NO DEV DEPENDENCIES – only production runtime packages.

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
strict = true
