[build-system]
requires = ["poetry-core>=1.9.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "taxflow-ai"
version = "9.0.0"
description = "AI‑powered tax automation platform"
authors = ["TaxFlow AI <dev@taxflow.ai>"]
license = "Proprietary"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
pydantic = "^2.10.3"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.14.1"
redis = "^5.2.1"
celery = "^5.4.0"
httpx = "^0.28.1"
python-jose = { extras = ["cryptography"], version = "^3.4.0" }
passlib = { extras = ["argon2"], version = "^1.7.4" }
python-multipart = "^0.0.20"
openai = "^1.58.1"
stripe = "^11.4.0"
boto3 = "^1.35.87"
tenacity = "^9.0.0"
structlog = "^24.4.0"
prometheus-client = "^0.21.1"
opentelemetry-api = "^1.29.0"
opentelemetry-sdk = "^1.29.0"
opentelemetry-instrumentation-fastapi = "^1.29.0"
opentelemetry-exporter-otlp = "^1.29.0"
slowapi = "^0.1.9"
pyotp = "^2.10.0"
qrcode = "^8.0"
email-validator = "^2.2.0"
cryptography = "^44.0.0"
pgvector = "^0.3.5"
aiosmtplib = "^3.0.2"
jinja2 = "^3.1.4"
sentry-sdk = "^2.18.0"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
aiocache = { extras = ["redis"], version = "^0.12.3" }
pillow = "^11.0.0"
pdfplumber = "^0.11.5"
httpx-oauth = "^0.13.0"
mixpanel = "^4.10.0"
pyarrow = "^19.0.0"

# 🔥 NO DEV DEPENDENCIES – they cause conflicts and aren't needed for production.

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
