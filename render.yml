services:
  - type: web
    name: legendary-chainsaw
    runtime: python
    buildCommand: ""  # Empty – Render auto-detects Poetry
    startCommand: poetry run uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
